name: "first workflow"
on: 
    push:
    pull_request:
        branches:
            - main
            - dev
            - qa
jobs:
    first-job:
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v3
              with:
                node-version: 24
                cache: "npm"

            - name: install dependencies
              run: npm ci
              
            - name: make angular build
              run: npm run build