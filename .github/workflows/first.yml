name: "First Workflow"
on: push
jobs:
    job1: 
        runs-on: windows-latest
        steps:
            - name: Checkout on VM
              uses: actions/checkout@v4

            - name: setup node
              uses: actions/setup-node@v4
              with: 
                node-version: 24
                cache: npm

            - name: install dependencies
              run:  npm ci 

            - name: make build
              run: npm run build  

